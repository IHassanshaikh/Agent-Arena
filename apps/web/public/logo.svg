<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" fill="none">
  <!-- Emblem Icon -->
  <g transform="translate(4, 4)">
    <rect width="32" height="32" rx="8" fill="#111114"/>
    <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#27272a"/>
    <!-- Arena Track -->
    <circle cx="16" cy="16" r="10" stroke="#18181b" stroke-width="2"/>
    <path d="M16 6 A 10 10 0 0 1 26 16" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 26 A 10 10 0 0 1 6 16" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <!-- Coordinate Reticle -->
    <line x1="16" y1="3" x2="16" y2="5" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="27" x2="16" y2="29" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="16" x2="5" y2="16" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="27" y1="16" x2="29" y2="16" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Core Node -->
    <rect x="12" y="12" width="8" height="8" rx="2" fill="#18181b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="1.75" fill="#10b981"/>
  </g>

  <!-- Wordmark -->
  <text x="46" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">AGENT<tspan fill="#3b82f6">ARENA</tspan></text>
  <text x="46" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8" font-weight="600" fill="#71717a" letter-spacing="1.5">FLIGHT RECORDER</text>
  
  <!-- Status Badge -->
  <rect x="180" y="12" width="46" height="16" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="188" cy="20" r="2.5" fill="#10b981"/>
  <text x="194" y="23" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10b981" letter-spacing="0.5">TRACES</text>
</svg>
